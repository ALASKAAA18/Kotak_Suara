<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Kotak Surat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: #fff;
      color: #252525;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 420px);
      padding: 36px;
      border: 1px solid #eadfae;
      border-radius: 18px;
      background: #fffdf5;
      box-shadow: 0 16px 44px rgb(87 67 10 / 9%);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .intro {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #d6d0bd;
      border-radius: 9px;
      background: #fff;
      color: #252525;
      font: inherit;
    }

    input:focus-visible {
      border-color: #b28a0d;
      outline: 3px solid rgb(248 202 50 / 35%);
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      background: #f8ca32;
      color: #252525;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #f4bf1c;
    }

    button:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 3px;
    }

    .status {
      min-height: 22px;
      margin: 12px 0 0;
      color: #795d00;
      font-size: 13px;
      text-align: center;
    }

    .back-link {
      display: block;
      margin-top: 16px;
      color: #795d00;
      text-align: center;
    }

    a:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Login</h1>
    <p class="intro">Masuk dengan akun admin Kotak Surat</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Masukkan email admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
      </div>
      <button type="submit">Login</button>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="Homepage.html">Kembali ke halaman utama</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      window.KOTAK_SURAT_SUPABASE_URL,
      window.KOTAK_SURAT_SUPABASE_ANON_KEY
    );
    const loginForm = document.getElementById("login-form");
    const loginButton = loginForm.querySelector("button");
    const status = document.getElementById("login-status");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(event.currentTarget);
      const email = formData.get("email").trim();
      const password = formData.get("password");
      loginButton.disabled = true;
      status.textContent = "Memeriksa akun...";
      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "Admin.html";
      } catch (error) {
        status.textContent = "Login gagal. Periksa email, password, dan konfigurasi Supabase.";
        console.error("Gagal login admin:", error);
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
