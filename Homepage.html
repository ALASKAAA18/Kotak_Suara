<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayo Buat Suratmu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: #252525;
      background: #FFF09F url("BG.png") center center / cover no-repeat fixed;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .topbar {
      display: flex;
      min-height: 88px;
      align-items: center;
      padding: 14px clamp(20px, 6vw, 80px);
      background: #f8ca32;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      background: #fff9e6;
    }

    .header-logo {
      width: 50px;
      height: 50px;
      border: 2px solid #9d7b12;
      border-radius: 50%;
    }

    .header-logo img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 3px;
      object-fit: contain;
    }

    .logo-link {
      display: block;
      border-radius: 50%;
    }

    .logo-link:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 4px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    main {
      display: grid;
      min-height: calc(100vh - 88px);
      padding: 48px 24px;
      place-items: center;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-16px);
    }

    .main-logo {
      display: block;
      width: 250px;
      aspect-ratio: 1;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 800;
      letter-spacing: -.04em;
      transform: translateY(-24px);
    }

    .cta {
      display: inline-block;
      margin-top: 0;
      padding: 14px 28px;
      border: 2px solid #e4b51b;
      border-radius: 12px;
      background: #f8ca32;
      color: #252525;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      background: #f4bf1c;
    }

    .cta:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 4px;
    }

    .hero-description {
      max-width: 520px;
      margin: 12px 0 0;
      color: #493d20;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        background-position: center center;
        background-size: 100% auto;
        background-attachment: scroll;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        min-height: 76px;
      }

      main {
        min-height: calc(100vh - 76px);
      }

      .header-logo {
        width: 44px;
        height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <a class="logo-link" href="Login.html" aria-label="Ke halaman login">
        <span class="logo header-logo" aria-hidden="true">
          <img src="asadeka%20logo.jpeg" alt="">
        </span>
      </a>

      <span class="brand-name">Kotak Saran &amp; Aspirasi</span>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <img class="main-logo" src="LOGOS.png" alt="Logo kotak surat">

      <h1 id="page-title">
        <a class="cta" href="Surat.html">Ayo Buat Suratmu</a>
      </h1>
      <p class="hero-description">Mari sampaikan saran ✏️, kritik 💬, atau aspirasi 🌟 kamu untuk kemajuan bersama!</p>
    </section>
  </main>
</body>
</html>
