<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Kotak Surat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 56px;
      background: #fff;
      color: #252525;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 32px;
    }

    a,
    button {
      display: inline-block;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #f8ca32;
      color: #252525;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: #eee8d6;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 4px;
    }

    .letter-list {
      display: grid;
      gap: 16px;
    }

    .letter-card {
      padding: 22px;
      border: 1px solid #eadfae;
      border-radius: 14px;
      background: #fffdf5;
      box-shadow: 0 8px 24px rgb(87 67 10 / 6%);
    }

    .letter-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .letter-meta {
      margin: 0 0 14px;
      color: #777;
      font-size: 13px;
    }

    .letter-card details {
      padding-top: 14px;
      border-top: 1px solid #eadfae;
    }

    .letter-card summary {
      color: #795d00;
      font-weight: 700;
      cursor: pointer;
    }

    .letter-message {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .letter-card .delete-button {
      margin-top: 8px;
      background: #f2d3cd;
    }

    .empty-state,
    .error-state {
      padding: 24px;
      border: 1px dashed #d6c98f;
      border-radius: 12px;
      color: #666;
      text-align: center;
    }

    .error-state {
      border-color: #c46c5e;
      color: #8e3225;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px 40px;
      }

      .letter-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Halaman Admin</h1>
    <p>Login berhasil. Selamat datang di halaman admin Kotak Surat.</p>
    <div class="actions">
      <a href="Homepage.html">Ke halaman utama</a>
      <button id="logout-button" type="button">Logout</button>
    </div>
    <section aria-labelledby="inbox-heading">
      <h2 id="inbox-heading">Kotak Surat</h2>
      <div class="letter-list" id="letter-list" aria-live="polite"></div>
    </section>
  </main>
  <script>
    if (sessionStorage.getItem("kotak-surat-admin-login") !== "true") {
      window.location.replace("Login.html");
    }

    const lettersStorageKey = "kotak-surat-letters";
    const letterList = document.getElementById("letter-list");

    function readLetters() {
      const storedLetters = localStorage.getItem(lettersStorageKey);
      if (!storedLetters) return [];

      const letters = JSON.parse(storedLetters);
      if (!Array.isArray(letters)) {
        throw new Error("Data surat yang tersimpan bukan daftar yang valid.");
      }
      return letters;
    }

    function renderLetters() {
      letterList.replaceChildren();

      let letters;
      try {
        letters = readLetters();
      } catch (error) {
        const errorMessage = document.createElement("p");
        errorMessage.className = "error-state";
        errorMessage.textContent = "Surat tidak dapat dimuat. Data penyimpanan mungkin rusak.";
        letterList.append(errorMessage);
        console.error("Gagal membaca surat:", error);
        return;
      }

      if (letters.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty-state";
        emptyMessage.textContent = "Belum ada surat yang masuk.";
        letterList.append(emptyMessage);
        return;
      }

      for (const letter of letters) {
        if (!letter || typeof letter.id !== "string" ||
            typeof letter.recipient !== "string" ||
            typeof letter.message !== "string" ||
            typeof letter.sender !== "string") {
          console.error("Surat dengan format tidak valid dilewati:", letter);
          continue;
        }

        const card = document.createElement("article");
        card.className = "letter-card";

        const heading = document.createElement("h2");
        heading.textContent = `Untuk: ${letter.recipient}`;

        const metadata = document.createElement("p");
        metadata.className = "letter-meta";
        metadata.textContent = `Dari: ${letter.sender}${letter.sentAt ? ` · ${new Date(letter.sentAt).toLocaleString("id-ID")}` : ""}`;

        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Baca surat";

        const message = document.createElement("p");
        message.className = "letter-message";
        message.textContent = letter.message;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Hapus surat";
        deleteButton.addEventListener("click", () => deleteLetter(letter.id));

        details.append(summary, message);
        card.append(heading, metadata, details, deleteButton);
        letterList.append(card);
      }
    }

    function deleteLetter(letterId) {
      try {
        const letters = readLetters();
        const remainingLetters = letters.filter((letter) => letter && letter.id !== letterId);
        localStorage.setItem(lettersStorageKey, JSON.stringify(remainingLetters));
        renderLetters();
      } catch (error) {
        console.error("Gagal menghapus surat:", error);
        window.alert("Surat gagal dihapus. Coba lagi atau periksa pengaturan browser.");
      }
    }

    renderLetters();
    window.addEventListener("storage", (event) => {
      if (event.key === lettersStorageKey) renderLetters();
    });

    document.getElementById("logout-button").addEventListener("click", () => {
      sessionStorage.removeItem("kotak-surat-admin-login");
      window.location.href = "Login.html";
    });
  </script>
</body>
</html>
