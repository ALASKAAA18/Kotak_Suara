<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Kotak Surat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px 56px;
      background: #fff;
      color: #252525;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 32px;
    }

    a,
    button {
      display: inline-block;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #f8ca32;
      color: #252525;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: #eee8d6;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #252525;
      outline-offset: 4px;
    }

    .letter-list {
      display: grid;
      gap: 16px;
    }

    .letter-card {
      padding: 22px;
      border: 1px solid #eadfae;
      border-radius: 14px;
      background: #fffdf5;
      box-shadow: 0 8px 24px rgb(87 67 10 / 6%);
    }

    .letter-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .letter-meta {
      margin: 0 0 14px;
      color: #777;
      font-size: 13px;
    }

    .letter-card details {
      padding-top: 14px;
      border-top: 1px solid #eadfae;
    }

    .letter-card summary {
      color: #795d00;
      font-weight: 700;
      cursor: pointer;
    }

    .letter-message {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .letter-card .delete-button {
      margin-top: 8px;
      background: #f2d3cd;
    }

    .empty-state,
    .error-state {
      padding: 24px;
      border: 1px dashed #d6c98f;
      border-radius: 12px;
      color: #666;
      text-align: center;
    }

    .error-state {
      border-color: #c46c5e;
      color: #8e3225;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px 40px;
      }

      .letter-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Halaman Admin</h1>
    <p>Login berhasil. Selamat datang di halaman admin Kotak Surat.</p>
    <div class="actions">
      <a href="Homepage.html">Ke halaman utama</a>
      <button id="refresh-button" type="button">Muat ulang surat</button>
      <button id="logout-button" type="button">Logout</button>
    </div>
    <section aria-labelledby="inbox-heading">
      <h2 id="inbox-heading">Kotak Surat</h2>
      <div class="letter-list" id="letter-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const letterList = document.getElementById("letter-list");
    const supabaseClient = window.supabase.createClient(
      window.KOTAK_SURAT_SUPABASE_URL,
      window.KOTAK_SURAT_SUPABASE_ANON_KEY
    );

    function showError(message, error) {
      const errorMessage = document.createElement("p");
      errorMessage.className = "error-state";
      errorMessage.textContent = message;
      letterList.replaceChildren(errorMessage);
      console.error(message, error);
    }

    async function renderLetters() {
      try {
        const { data: letters, error } = await supabaseClient
          .from("letters")
          .select("id, recipient, message, sender, sent_at")
          .order("sent_at", { ascending: false });
        if (error) throw error;
        displayLetters(letters);
      } catch (error) {
        showError("Surat tidak dapat dimuat. Periksa koneksi, konfigurasi, dan izin Supabase.", error);
      }
    }

    function displayLetters(letters) {
      letterList.replaceChildren();
      if (letters.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty-state";
        emptyMessage.textContent = "Belum ada surat yang masuk.";
        letterList.append(emptyMessage);
        return;
      }

      for (const letter of letters) {
        if (!letter || typeof letter.id !== "string" ||
            typeof letter.recipient !== "string" ||
            typeof letter.message !== "string" ||
            typeof letter.sender !== "string") {
          console.error("Surat dengan format tidak valid dilewati:", letter);
          continue;
        }

        const card = document.createElement("article");
        card.className = "letter-card";

        const heading = document.createElement("h2");
        heading.textContent = `Untuk: ${letter.recipient}`;

        const metadata = document.createElement("p");
        metadata.className = "letter-meta";
        metadata.textContent = `Dari: ${letter.sender}${letter.sent_at ? ` · ${new Date(letter.sent_at).toLocaleString("id-ID")}` : ""}`;

        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Baca surat";

        const message = document.createElement("p");
        message.className = "letter-message";
        message.textContent = letter.message;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Hapus surat";
        deleteButton.addEventListener("click", () => deleteLetter(letter.id));

        details.append(summary, message);
        card.append(heading, metadata, details, deleteButton);
        letterList.append(card);
      }
    }

    async function deleteLetter(letterId) {
      if (!window.confirm("Hapus surat ini secara permanen? Tindakan ini tidak bisa dibatalkan.")) {
        return;
      }

      try {
        const { error } = await supabaseClient.from("letters").delete().eq("id", letterId);
        if (error) throw error;
        await renderLetters();
      } catch (error) {
        console.error("Gagal menghapus surat:", error);
        window.alert("Surat gagal dihapus. Periksa koneksi atau izin akun admin.");
      }
    }

    async function initializeAdmin() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!session) {
          window.location.replace("Login.html");
          return;
        }
        await renderLetters();
        window.setInterval(renderLetters, 30000);
      } catch (error) {
        showError("Status login tidak dapat diperiksa. Coba muat ulang halaman.", error);
      }
    }

    document.getElementById("refresh-button").addEventListener("click", renderLetters);
    document.getElementById("logout-button").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        console.error("Gagal logout:", error);
        window.alert("Logout gagal. Coba lagi.");
        return;
      }
      window.location.href = "Login.html";
    });

    initializeAdmin();
  </script>
</body>
</html>
